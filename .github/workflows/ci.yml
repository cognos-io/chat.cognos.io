name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: run go tests
        run: go test ./...

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Analytics vendor strings stay confined to the adapter files, the
      # environment config, and the specs that test them
      # (docs/specs/product-analytics.md §10).
      - name: analytics grep guardrail
        run: |
          if git grep -n 'plausible\.io' -- \
            ':!docs/specs/product-analytics.md' \
            ':!web/src/lib/analytics.ts' \
            ':!web/src/layouts/BaseLayout.astro' \
            ':!web/scripts/check-analytics.mjs' \
            ':!frontend/src/environments/' \
            ':!frontend/src/app/services/analytics/' \
            ':!e2e/tests/analytics.spec.ts'; then
            echo '::error::plausible.io referenced outside the allowed analytics files (docs/specs/product-analytics.md §10)'
            exit 1
          fi

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: lint frontend
        run: pnpm --dir frontend lint

      - name: test frontend
        run: pnpm --dir frontend exec ng test --watch=false

      - name: build frontend
        run: pnpm --dir frontend build

      - name: lint ui-angular
        run: pnpm --dir packages/ui-angular lint

      - name: test ui-angular
        run: pnpm --dir packages/ui-angular exec ng test ui-angular --watch=false

      - name: build ui-angular
        run: pnpm --dir packages/ui-angular exec ng build ui-angular

      - name: build web
        run: pnpm --filter @cognos/web build

      # Asserts the production build carries the Plausible tag + data-track
      # CTAs and that the vendor string stays confined to the adapter files.
      - name: check web analytics build
        run: pnpm --filter @cognos/web test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Warm the Go build cache so the Playwright-managed `go run` servers
      # (mock AI provider + API) start within their webServer timeouts.
      - name: warm go build cache
        working-directory: backend
        run: go build ./cmd/mock-ai-provider ./cmd/api

      - name: install playwright browsers
        run: pnpm --filter @cognos/e2e exec playwright install --with-deps chromium

      - name: run e2e tests
        run: pnpm --filter @cognos/e2e test

      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Browser-level coverage of the app itself (account, billing, messages,
  # personas, models, vault). Runs a self-contained stack (mock AI + dev
  # backend + Angular dev server) via frontend/playwright.config.ts.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Warm the Go build cache so the Playwright-managed `go run` servers
      # (mock AI provider + API) start within their webServer timeouts.
      - name: warm go build cache
        working-directory: backend
        run: go build ./cmd/mock-ai-provider ./cmd/api

      - name: install playwright browsers
        run: pnpm --filter @cognos/chat exec playwright install --with-deps chromium

      - name: run frontend e2e tests
        run: pnpm --filter @cognos/chat test:e2e

      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build backend image
        run: docker build ./backend

      - name: build web image
        run: docker build ./web

  security:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: generate sbom
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
