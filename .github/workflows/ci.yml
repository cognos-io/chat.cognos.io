name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: run go tests
        run: go test ./...

      - name: run go vet
        run: go vet ./...

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: run govulncheck
        run: govulncheck ./...

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1

      - name: run staticcheck
        # U1000 is intentionally excluded because test helpers are shared by
        # build-tagged suites; ST1008 preserves the PocketBase repository API.
        run: staticcheck -checks=all,-ST1000,-ST1003,-ST1008,-ST1020,-U1000 ./...

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: run golangci-lint
        run: golangci-lint run --default=none --enable=govet --enable=ineffassign --enable=bodyclose ./...

      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.7

      - name: run gosec
        run: gosec ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Analytics vendor strings stay confined to the adapter files, the
      # environment config, and the docs that specify them
      # (docs/business_processes/product-analytics.md).
      - name: analytics grep guardrail
        run: |
          if git grep -n 'plausible\.io' -- \
            ':!docs/business_processes/product-analytics.md' \
            ':!docs/operations/analytics-dashboard.md' \
            ':!web/src/lib/analytics.ts' \
            ':!web/src/layouts/BaseLayout.astro' \
            ':!web/scripts/check-analytics.mjs' \
            ':!frontend/src/environments/' \
            ':!frontend/src/app/services/analytics/' \
            ':!e2e/tests/analytics.spec.ts' \
            ':!.github/workflows/ci.yml'; then
            echo '::error::plausible.io referenced outside the allowed analytics files (docs/business_processes/product-analytics.md)'
            exit 1
          fi

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: lint frontend
        run: pnpm --dir frontend lint

      - name: test frontend
        run: pnpm --dir frontend exec ng test --watch=false

      - name: build frontend
        run: pnpm --dir frontend build

      - name: lint ui-angular
        run: pnpm --dir packages/ui-angular lint

      - name: test ui-angular
        run: pnpm --dir packages/ui-angular exec ng test ui-angular --watch=false

      - name: build ui-angular
        run: pnpm --dir packages/ui-angular exec ng build ui-angular

      - name: build web
        run: pnpm --filter @cognos/web build

      # Asserts the production build carries the Plausible tag + data-track
      # CTAs and that the vendor string stays confined to the adapter files.
      - name: check web analytics build
        run: pnpm --filter @cognos/web test

      - name: install marketing accessibility browser
        run: pnpm --filter @cognos/web exec playwright install --with-deps chromium

      - name: test marketing accessibility
        run: pnpm --filter @cognos/web test:e2e

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Warm the Go build cache so the Playwright-managed `go run` servers
      # (mock AI provider + API) start within their webServer timeouts.
      - name: warm go build cache
        working-directory: backend
        run: go build ./cmd/mock-ai-provider ./cmd/api

      - name: install playwright browsers
        run: pnpm --filter @cognos/e2e exec playwright install --with-deps chromium

      - name: install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install --yes mkcert

      - name: run e2e tests
        run: pnpm --filter @cognos/e2e exec playwright test api.spec
        env:
          E2E_BASE_URL: https://127.0.0.1:8095
          E2E_POCKETBASE_URL: https://127.0.0.1:8095
          E2E_SKIP_FRONTEND: 1

      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Browser-level coverage of the app itself (account, billing, messages,
  # personas, models, vault). Runs a self-contained stack (mock AI + dev
  # backend + Angular dev server) via frontend/playwright.config.ts.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Warm the Go build cache so the Playwright-managed `go run` servers
      # (mock AI provider + API) start within their webServer timeouts.
      - name: warm go build cache
        working-directory: backend
        run: go build ./cmd/mock-ai-provider ./cmd/api

      - name: install playwright browsers
        run: pnpm --filter @cognos/chat exec playwright install --with-deps chromium

      - name: run frontend e2e tests
        run: pnpm --filter @cognos/chat test:e2e
        env:
          E2E_WORKERS: 1

      - name: upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build backend image
        run: podman build --file container/backend/Containerfile --tag cognos-backend:ci .

      - name: export backend image for scanning
        run: podman save --format docker-archive --output backend-image.tar cognos-backend:ci

      - name: scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          input: backend-image.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  security:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: generate sbom
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90
