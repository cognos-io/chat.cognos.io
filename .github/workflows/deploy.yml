name: deploy artefacts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cognos-backend
  # Name of this Application in the infrastructure repository's applications.yml.
  APPLICATION: cognos
  INFRASTRUCTURE_REPOSITORY: ${{ vars.INFRASTRUCTURE_REPOSITORY }}
  ARTIFACT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  backend-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ARTIFACT_SHA }}

      - name: setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push backend image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: container/backend/Containerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_COMMIT=${{ env.ARTIFACT_SHA }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.ARTIFACT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.revision=${{ env.ARTIFACT_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: attest backend image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: request infrastructure promotion
        # The infrastructure repository owns applications.yml and opens its own
        # promotion pull request. This token only grants Actions: write there,
        # so it cannot push to that repository or authorise a deployment.
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_DISPATCH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh workflow run promote-application.yml \
            --repo "${INFRASTRUCTURE_REPOSITORY}" \
            --ref main \
            -f application="${APPLICATION}" \
            -f image-tag="sha-${ARTIFACT_SHA}" \
            -f image-digest="${IMAGE_DIGEST}" \
            -f source-repository="${GITHUB_REPOSITORY}" \
            -f source-sha="${ARTIFACT_SHA}" \
            -f source-run-id="${GITHUB_RUN_ID}"

  static-sites:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ARTIFACT_SHA }}

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: test deployment uploader
        working-directory: backend
        run: go test ./cmd/bunny-deploy

      - name: lint frontend
        run: pnpm --dir frontend lint

      - name: test frontend
        run: pnpm --dir frontend exec ng test --watch=false

      - name: build frontend
        env:
          COGNOS_COMMIT_SHA: ${{ env.ARTIFACT_SHA }}
        run: pnpm --dir frontend build

      - name: build marketing site
        run: pnpm --filter @cognos/web build

      - name: deploy frontend to Bunny
        working-directory: backend
        run: go run ./cmd/bunny-deploy ../frontend/dist/browser
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_APP_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_APP_STORAGE_ZONE }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_APP_STORAGE_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_APP_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}

      - name: deploy marketing site to Bunny
        working-directory: backend
        run: go run ./cmd/bunny-deploy ../web/dist
        env:
          BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_WEB_STORAGE_ENDPOINT }}
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_WEB_STORAGE_ZONE }}
          BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_WEB_STORAGE_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_WEB_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
