<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="presentation">
  <!--
    Step 1 of 3: how a private-feeling conversation turns into a search result.
    Share pressed → a public URL exists → a crawler indexes it.

    Text-free by design (see hero.svg): the translated caption and alt text carry
    the meaning in all six locales. Palette from packages/ui styles/themes.css.
  -->
  <style>
    .surface { fill: #ffffff; }
    .sunken { fill: #f7f8f9; }
    .border { stroke: #dfe1e6; stroke-width: 2; fill: none; }
    .ink { fill: #172b4d; }
    .sub { fill: #626f86; }
    .brand { fill: #1f845a; }
    .arrow { stroke: #1f845a; stroke-width: 3; fill: none; stroke-linecap: round; }
    .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; fill: #626f86; }
  </style>

  <rect width="1200" height="620" fill="#f7f8f9" />

  <!-- ── 1. The share button is pressed ─────────────────────────────────── -->
  <g>
    <circle cx="60" cy="80" r="19" fill="#1f845a" />
    <text x="60" y="87" text-anchor="middle" class="num">1</text>

    <rect x="36" y="140" width="320" height="300" rx="14" class="surface" stroke="#dfe1e6" stroke-width="2" />
    <path d="M36 176 h320" class="border" />
    <circle cx="58" cy="158" r="4.5" fill="#c9372c" />
    <circle cx="74" cy="158" r="4.5" fill="#b8770b" />
    <circle cx="90" cy="158" r="4.5" fill="#22a06b" />

    <!-- Conversation, as readable bars. -->
    <rect x="60" y="206" width="200" height="7" rx="3.5" class="ink" opacity="0.75" />
    <rect x="60" y="222" width="256" height="7" rx="3.5" class="ink" opacity="0.55" />
    <rect x="60" y="238" width="164" height="7" rx="3.5" class="ink" opacity="0.7" />
    <rect x="60" y="272" width="272" height="7" rx="3.5" class="ink" opacity="0.6" />
    <rect x="60" y="288" width="212" height="7" rx="3.5" class="ink" opacity="0.75" />

    <!-- A pressed "share" control: node-and-branches glyph, no words. -->
    <rect x="196" y="352" width="136" height="46" rx="23" fill="#1f845a" />
    <circle cx="228" cy="366" r="6" fill="#ffffff" />
    <circle cx="228" cy="386" r="6" fill="#ffffff" />
    <circle cx="256" cy="376" r="6" fill="#ffffff" />
    <path d="M232 368 l20 6 M232 384 l20 -6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <rect x="272" y="372" width="42" height="8" rx="4" fill="#ffffff" opacity="0.85" />

    <!-- Cursor. -->
    <path d="M300 396 l0 30 8 -10 6 14 8 -4 -6 -13 13 1 z" fill="#172b4d" stroke="#ffffff" stroke-width="2" />
  </g>

  <path d="M382 290 h56" class="arrow" stroke-dasharray="9 8" />
  <path d="M432 280 l14 10 -14 10" class="arrow" stroke-linejoin="round" />

  <!-- ── 2. A public URL now exists ─────────────────────────────────────── -->
  <g>
    <circle cx="500" cy="80" r="19" fill="#1f845a" />
    <text x="500" y="87" text-anchor="middle" class="num">2</text>

    <rect x="472" y="200" width="256" height="180" rx="14" class="surface" stroke="#dfe1e6" stroke-width="2" />

    <!-- Globe: anyone, anywhere. -->
    <g transform="translate(600 268)">
      <circle r="40" fill="none" stroke="#1f845a" stroke-width="3" />
      <path d="M-40 0 h80 M0 -40 v80" stroke="#1f845a" stroke-width="2.5" opacity="0.7" />
      <ellipse rx="19" ry="40" fill="none" stroke="#1f845a" stroke-width="2.5" opacity="0.7" />
      <path d="M-36 -18 h72 M-36 18 h72" stroke="#1f845a" stroke-width="2.5" opacity="0.7" />
    </g>

    <rect x="496" y="330" width="208" height="26" rx="13" class="sunken" stroke="#dfe1e6" stroke-width="1" />
    <text x="600" y="348" text-anchor="middle" class="mono">/share/9f2c4b7e…</text>
  </g>

  <path d="M754 290 h56" class="arrow" stroke-dasharray="9 8" />
  <path d="M804 280 l14 10 -14 10" class="arrow" stroke-linejoin="round" />

  <!-- ── 3. A crawler indexes it ────────────────────────────────────────── -->
  <g>
    <circle cx="960" cy="80" r="19" fill="#1f845a" />
    <text x="960" y="87" text-anchor="middle" class="num">3</text>

    <rect x="844" y="140" width="320" height="300" rx="14" class="surface" stroke="#dfe1e6" stroke-width="2" />

    <!-- Search field. -->
    <rect x="872" y="172" width="264" height="36" rx="18" class="sunken" stroke="#dfe1e6" stroke-width="2" />
    <circle cx="896" cy="190" r="8.5" fill="none" stroke="#1f845a" stroke-width="3" />
    <path d="M903 197 l8 8" stroke="#1f845a" stroke-width="3" stroke-linecap="round" />
    <rect x="920" y="186" width="110" height="7" rx="3.5" class="sub" opacity="0.5" />

    <!-- Indexed results, one of them the shared conversation. -->
    <rect x="872" y="238" width="176" height="8" rx="4" fill="#0c66e4" opacity="0.85" />
    <text x="872" y="270" class="mono">/share/9f2c4b7e…</text>
    <rect x="872" y="282" width="248" height="6" rx="3" class="sub" opacity="0.45" />
    <rect x="872" y="296" width="196" height="6" rx="3" class="sub" opacity="0.45" />

    <rect x="872" y="332" width="150" height="8" rx="4" fill="#0c66e4" opacity="0.85" />
    <rect x="872" y="354" width="236" height="6" rx="3" class="sub" opacity="0.45" />
    <rect x="872" y="368" width="180" height="6" rx="3" class="sub" opacity="0.45" />

    <rect x="872" y="398" width="164" height="8" rx="4" fill="#0c66e4" opacity="0.85" />
  </g>
</svg>
