# Cognos API configuration (example)
#
# Copy this file to one or more environment-specific files in this directory:
#   - api.local.yaml
#   - api.development.yaml
#   - api.production.yaml
#
# All matching files that exist are loaded in that order; later files override
# earlier ones. See internal/config/api.go for the loader.
#
# Precedence (lowest to highest):
#   1. configs/api.{development,production,local}.yaml
#   2. COGNOS_* environment variables
#   3. COGNOS_*_API_KEY_FILE secret files (env-only; not supported in YAML)
#
# Every value is OPTIONAL — only configure the providers you actually use.
# Secrets (api_key fields) belong in env vars or mounted secret files in
# production; avoid committing populated config files.

# --- Bifrost ------------------------------------------------------------------
# In-process AI gateway. Useful log levels: error, warn, info, debug.
# Env override: COGNOS_BIFROST_LOG_LEVEL
# Default when unset: error
bifrost:
  log_level: error

# --- Infomaniak (OpenAI-compatible AI proxy) ----------------------------------
# Env overrides: COGNOS_INFOMANIAK_API_KEY, COGNOS_INFOMANIAK_URL,
#                COGNOS_INFOMANIAK_PRODUCT_ID
# Secret file override: COGNOS_INFOMANIAK_API_KEY_FILE
#
# url is optional — leave empty to derive the base URL from product_id.
# Example explicit override:
#   url: https://api.infomaniak.com/2/ai/109300/openai
infomaniak:
  api_key: ""
  url: ""
  product_id: ""

# --- Requesty (OpenAI-compatible EU gateway) ----------------------------------
# Zero-data-retention LLM router hosted in Frankfurt (AWS eu-central-1).
# Env overrides: COGNOS_REQUESTY_API_KEY, COGNOS_REQUESTY_URL
# Secret file override: COGNOS_REQUESTY_API_KEY_FILE
#
# url is optional; defaults to https://router.eu.requesty.ai (the EU gateway)
# when empty. Do NOT append "/v1" — the gateway adds the OpenAI path itself.
# Full EU residency also requires EU-region model ids in the catalogue.
requesty:
  url: ""
  api_key: ""

# --- Billing ------------------------------------------------------------------
# Starting trial balance granted to new accounts, in Swiss Rappen (centimes).
# Must be > 0; defaults to 200 (CHF 2.00) when unset or non-positive.
# Env override: COGNOS_BILLING_TRIAL_SEED_RAPPEN
billing:
  trial_seed_rappen: 200

# --- Paddle (payments) --------------------------------------------------------
# Optional: without api_key the /api/v1/billing/{checkout,portal,cancel,resume}
# routes return 503. The frontend also needs a client-side token + environment
# (frontend/src/environments/environment*.ts: paddleClientToken, paddleEnvironment)
# to open the Paddle.js overlay; without it checkout falls back to a redirect.
# api_base defaults to https://api.paddle.com (use the sandbox host for testing).
# price_* are Paddle price IDs (pri_...). Env overrides: COGNOS_PADDLE_API_BASE,
# COGNOS_PADDLE_API_KEY, COGNOS_PADDLE_WEBHOOK_SECRET, COGNOS_PADDLE_PRICE_PAYG,
# COGNOS_PADDLE_PRICE_PAYG_OVERAGE, COGNOS_PADDLE_PRICE_UNLIMITED_MONTHLY,
# COGNOS_PADDLE_PRICE_UNLIMITED_ANNUAL.
# Secret-file overrides: COGNOS_PADDLE_API_KEY_FILE, COGNOS_PADDLE_WEBHOOK_SECRET_FILE.
paddle:
  api_base: "https://api.paddle.com"
  api_key: ""
  webhook_secret: ""
  price_payg: ""
  price_payg_overage: ""
  price_unlimited_monthly: ""
  price_unlimited_annual: ""

# --- MFA (two-factor authentication) ------------------------------------------
# Server-held key that encrypts authenticator-app (TOTP) seeds at rest. Base64
# of exactly 32 random bytes. REQUIRED for MFA: while unset, the enrolment
# endpoints return "MFA is not configured" and no one can turn on 2FA (we never
# store a seed in plaintext). Existing sign-ins are unaffected.
#
# Generate one with:   openssl rand -base64 32
#
# Treat it like any other secret: set it via the env var or a mounted secret
# file in production, NOT in a committed config file. Rotating the key strands
# already-enrolled seeds (affected users must re-enrol); secret_key_id records
# which key sealed each row.
# Env override: COGNOS_MFA_TOTP_ENCRYPTION_KEY
# Secret file override: COGNOS_MFA_TOTP_ENCRYPTION_KEY_FILE
mfa:
  totp_encryption_key: ""

# --- Env-only (not loaded from YAML) ------------------------------------------
# BILLING_FX_RATE_FALLBACK_USD_CHF — fallback USD→CHF rate when the live rate
# is unavailable. Defaults to 0.88. Set via environment variable only.
