pre-commit:
  parallel: true
  commands:
    gitleaks:
      glob: "*"
      run: gitleaks protect --staged --no-banner
    markdown-format:
      run: uv run rumdl check --fix {staged_files}
      stage_fixed: true
      glob:
        - "*.md"
      exclude:
        - "ai/**"
        - ".specify/**"
        - ".cursor/**"
        - ".claude/**"
    frontend-eslint:
      root: "frontend/"
      glob: "*.{js,ts}"
      run: pnpm exec eslint --cache --fix {staged_files}
      stage_fixed: true
    frontend-prettier:
      root: "frontend/"
      glob: "*.{ts,js,json,html,scss,css,md}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
