pre-commit:
  jobs:
    # Runs first and alone: it rewrites characters, which changes line lengths,
    # so the formatters below must get the last word on wrapping.
    - name: remove-ai-slop
      glob: "*"
      exclude:
        - "pnpm-lock.yaml"
      run: node scripts/remove-ai-slop.mjs {staged_files}
      stage_fixed: true

    - group:
        parallel: true
        jobs:
          - name: gitleaks
            glob: "*"
            run: gitleaks protect --staged --no-banner
          - name: markdown-format
            glob:
              - "*.md"
            exclude:
              - "ai/**"
              - ".specify/**"
              - ".cursor/**"
              - ".claude/**"
            run: uv run rumdl check --fix {staged_files}
            stage_fixed: true
          - name: prettier
            glob: "*.{ts,js,json,html,scss,css}"
            exclude:
              - "backend/**"
              - "pnpm-lock.yaml"
            run: pnpm exec prettier --write --ignore-unknown {staged_files}
            stage_fixed: true
          - name: frontend-eslint
            root: "frontend/"
            glob: "*.{js,ts}"
            run: pnpm exec eslint --cache --fix {staged_files}
            stage_fixed: true
          - name: ui-eslint
            root: "packages/ui/"
            glob: "*.js"
            exclude:
              - "packages/ui-angular/**"
            run: pnpm exec eslint --cache --fix {staged_files}
            stage_fixed: true
          - name: ui-angular-eslint
            root: "packages/ui-angular/"
            glob: "*.{ts,html}"
            run: pnpm exec eslint --cache --fix {staged_files}
            stage_fixed: true
