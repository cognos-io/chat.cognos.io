<!doctype html>
<html lang="en" data-theme="light" data-accent="emerald">
  <head>
    <meta charset="utf-8" />
    <!--
      Appearance theme flash guard. Runs synchronously before any stylesheet
      applies so the first paint is in the user's chosen theme (no light/dark
      flash). Mirrors resolveTheme() in app/theme/theme.ts; the ThemeService
      takes over once Angular boots. Keep this logic tiny and dependency-free.
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cognos:theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') {
            pref = 'system';
          }
          var resolved = pref;
          if (pref === 'system') {
            resolved =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage/matchMedia unavailable — fall back to the static default. */
        }
      })();
    </script>
    <title>Cognos - Privacy friendly AI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 180×180 -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />

    <meta property="og:site_name" content="Cognos" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Privacy focused AI " />
    <meta
      property="og:description"
      content="Protect your privacy when using generative AI. Cognos gives you access to the latest models without compromising your data."
    />

    <meta property="og:url" content="https://app.cognos.io/" />
    <meta
      property="og:image"
      content="https://cognos.io/content/images/size/w1200/2024/02/Twitter-post---general-6.png"
    />

    <meta name="twitter:card" content="summary_large_image" />

      content="Protect your privacy when using generative AI. Cognos gives you access to the latest models without compromising your data."

    <meta name="twitter:url" content="https://app.cognos.io/" />
