<header class="chat-header">
  @if (breadcrumbs().length) {
    <cog-breadcrumbs class="chat-header__breadcrumbs" [items]="breadcrumbs()" />
  }

  <div class="chat-header__row">
    <h1 class="chat-header__title" [attr.title]="title()">{{ title() }}</h1>

    <div class="chat-header__actions">
      @if (hasOtherPeople()) {
        <cog-avatar
          class="chat-header__avatar"
          [name]="currentUserName()"
          [size]="28"
        />
      }

      @if (canShare()) {
        @if (isShared()) {
          <button
            type="button"
            class="chat-header__shared"
            title="This conversation is shared with a public link — manage sharing"
            (click)="onShare()"
          >
            <cog-icon name="link" [size]="16" tone="current" />
            Shared
          </button>
        } @else {
          <cog-button
            class="chat-header__share"
            appearance="default"
            icon="user-plus"
            title="Share this conversation"
            (click)="onShare()"
          >
            Share
          </cog-button>
        }
      }

      <cog-icon-button
        name="shield-check"
        title="Security & keys"
        (click)="openSecurity()"
      />

      @if (menuItems().length) {
        <div class="chat-header__menu-wrap">
          <cog-icon-button
            name="more-horizontal"
            title="Conversation menu"
            [selected]="menuOpen()"
            (click)="toggleMenu($event)"
          />

          @if (menuOpen()) {
            <div class="chat-header__menu">
              <cog-menu [items]="menuItems()" (itemSelect)="onMenuSelect($event)" />
            </div>
          }
        </div>
      }
    </div>
  </div>
</header>

<cog-security-modal
  [open]="securityOpen()"
  [fingerprint]="fingerprint()"
  [verified]="hasDeviceKey()"
  (close)="closeSecurity()"
/>
