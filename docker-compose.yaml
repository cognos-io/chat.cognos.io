name: chat-cognos-io

services:
  web:
    build: ./web
    restart: unless-stopped
    # Hardening: drop all Linux capabilities except the one Caddy needs to bind
    # the privileged TLS/HTTP ports, forbid privilege escalation, and run the
    # root filesystem read-only (Caddy still writes certs to the /data volume
    # and its admin socket to the /run/caddy tmpfs).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /run/caddy
      - /tmp
    environment:
      CADDY_ADMIN: "unix//run/caddy/admin.sock"
    env_file:
      - ./web/.env
    networks:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile
      - web-data:/data
      - web-config:/config

  backend:
    build: ./backend
    restart: unless-stopped
    user: "1001:0"
    # Hardening: read-only root (PocketBase only writes the pb_data volume),
    # no capabilities, no privilege escalation, bounded resources, and a
    # health check on the app's /health route.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 2.0
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ./backend/.env
    environment:
      COGNOS_INFOMANIAK_API_KEY_FILE: /run/secrets/infomaniak_api_key
    networks:
      - backend
    ports: []
    volumes:
      - db-data:/home/appuser/pb_data
    secrets:
      - infomaniak_api_key

  backup:
    image: ghcr.io/borgmatic-collective/borgmatic
    restart: unless-stopped
    # Hardening: no capabilities + no privilege escalation + bounded resources.
    # Not read_only — borg needs to write its cache/locks; tighten separately.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    env_file:
      - ./backup/.env
    environment:
      BORG_PASSPHRASE_FILE: /run/secrets/borg_passphrase
      BORG_RSH: ssh -i /run/secrets/borg_ssh_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/run/secrets/borg_known_hosts
    volumes:
      - web-data:/source/caddy-data:ro # Caddy data
      - web-config:/source/caddy-config:ro # Caddy configuration
      - db-data:/cognos-db # Pocketbase SQLite database
      - ./backup/borgmatic.d:/etc/borgmatic.d:ro # Borgmatic configuration
    secrets:
      - borg_passphrase
      - borg_ssh_key
      - borg_known_hosts

volumes:
  # Stores Caddy TLS certificates and other data
  # https://caddyserver.com/docs/conventions#data-directory
  web-data:
  web-config:
  db-data:

networks:
  backend:

secrets:
  infomaniak_api_key:
    file: ./backend/secrets/infomaniak_api_key
  borg_passphrase:
    file: ./backup/secrets/borg_passphrase
  borg_ssh_key:
    file: ./backup/secrets/borg_ssh_key
  borg_known_hosts:
    file: ./backup/secrets/borg_known_hosts
